/* iPhone Home Screen (standalone) safe area fix: keep header controls below Dynamic Island/status bar. */
@media all and (display-mode: standalone) and (max-width: 999px) {
  .app-header {
    /* The fallback covers iOS builds reporting a zero top inset. */
    --standalone-top-inset: max(56px, env(safe-area-inset-top, 0px));
    height: calc(var(--header) + var(--standalone-top-inset));
    padding-top: var(--standalone-top-inset);
    background: #10182b;
    -webkit-backdrop-filter: blur(18px);
  }
}

<title>Dispute Studio — Report Reader & Credit Cases</title>
</head>
<body>
<div id="app"><div class="loading-screen"><div class="loading-mark">DS</div><h1>Dispute Studio</h1><p>Private credit case workspace</p></div></div>
<div id="toast" aria-live="polite"></div>
<div id="modal" class="modal-root" hidden></div>
<div id="printArea" aria-hidden="true"></div>
<script>/* Dispute Studio Report Reader v2: on-device, rules-based text extraction and review.
   No external report-upload API. PDF.js/Tesseract libraries load on demand from public CDNs. */
'use strict';
const REPORT_PDF_URL='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const REPORT_PDF_WORKER='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const REPORT_OCR_URL='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
const reportReader={files:[],extracted:[],accounts:[],profile:{},reportText:'',paste:'',status:'',busy:false,cancel:false,selected:new Set(),review:{},showText:false,speaking:false,speechQueue:[],voiceRate:0.92,ocrWorker:null,importResult:'',error:''};
const rrEsc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const rrShort=(x,n=140)=>String(x||'').trim().slice(0,n);
const rrSanitize=x=>String(x||'').replace(/\b\d{3}[-. ]?\d{2}[-. ]?\d{4}\b/g,'[SSN hidden]').replace(/\b(?:\d[ -]?){13,19}\b/g,'[long number hidden]');
const rrNum=s=>{if(!s)return '';const m=String(s).match(/-?\$?\s*([\d,]+(?:\.\d{1,2})?)/);return m?m[1].replace(/,/g,''):''};
const rrMoney=s=>s!==''&&Number.isFinite(Number(s))?'$'+Number(s).toLocaleString('en-US',{maximumFractionDigits:2,minimumFractionDigits:0}):'Not shown';
const rrLast4=s=>{const v=String(s||'').trim();const digits=v.replace(/\D/g,'');return digits.length>=4?digits.slice(-4):''};
const rrDate=s=>{if(!s)return '';const v=String(s).trim(),m=v.match(/\b(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})\b/);if(m){const month=+m[1],day=+m[2];if(month>=1&&month<=12&&day>=1&&day<=31)return `${m[3]}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;}const iso=v.match(/\b(20\d\d|19\d\d)-(\d\d)-(\d\d)\b/);if(iso)return iso[0];const textual=v.match(/\b(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\s+\d{1,2},?\s+\d{4}\b/i);if(textual){const d=new Date(textual[0]);if(!isNaN(d))return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}return ''};
function rrLines(text){return String(text||'').replace(/\r/g,'\n').replace(/\u00a0/g,' ').replace(/[\u2028\u2029]/g,'\n').replace(/\t/g,'  ').split(/\n/).map(x=>x.trim()).filter(Boolean)}
function rrField(lines,keys){const re=new RegExp('^(?:'+keys.join('|')+')(?:\\s*[:#–-]\\s*|\\s{2,})(.*)$','i');for(let i=0;i<lines.length;i++){const m=lines[i].match(re);if(!m)continue;let v=m[1]?.trim()||'';if(!v&&i+1<lines.length&&!/^(?:Account\s*(?:Number|Name|Status)|Balance|Credit\s*Limit|Date|Status|Payment\s*Status|Report\s*Date)\b/i.test(lines[i+1]))v=lines[i+1].trim();if(v&&v.length<240)return v;}return ''}
function rrCompany(v){return rrShort(v.replace(/^(?:reported by|account name|creditor|company name)\s*:?\s*/i,'').replace(/\s*\|.*$/,''),80)}
function rrBureau(text,filename,override){if(override&&override!=='auto')return override;const x=(filename+' '+text.slice(0,1600)).toLowerCase();return /transunion/.test(x)?'TransUnion':/equifax/.test(x)?'Equifax':/experian/.test(x)?'Experian':'Not identified'}
function rrProfile(lines){const name=rrField(lines,['Consumer\\s*Name','Full\\s*Name','Report\\s*For','Prepared\\s*For','Personal\\s*Name']);const a=rrField(lines,['Current\\s*(?:Mailing\\s*)?Address','Mailing\\s*Address','Residential\\s*Address']);const p={};if(name&&/^[A-Za-z][A-Za-z\-' ]{3,75}$/.test(name)&&name.trim().split(/\s+/).length>=2)p.name=name.trim();if(a&&a.length<130)p.address=a.trim();const c=rrField(lines,['City']),st=rrField(lines,['State']),zip=rrField(lines,['ZIP(?:\\s*Code)?']);if(c&&c.length<65)p.city=c;if(st&&/^[A-Za-z]{2,20}$/.test(st))p.state=st;if(zip&&/^\d{5}/.test(zip))p.zip=zip.slice(0,5);const full=(a||'').match(/^(.+?\b(?:Street|St\.?|Ave\.?|Avenue|Road|Rd\.?|Boulevard|Blvd\.?|Lane|Ln\.?|Drive|Dr\.?|Court|Ct\.?|Way|Place|Pl\.?)\b(?:\s+(?:Apt|Apartment|Unit|Ste|Suite)\s*#?\w+)?)\s*,?\s+([A-Za-z][A-Za-z\s.'-]+?)\s*,?\s+([A-Z]{2})\s+(\d{5}(?:-\d{4})?)$/i);if(full){p.address=full[1].trim();p.city=full[2].trim();p.state=full[3];p.zip=full[4].slice(0,5)}return p}
function rrAccountAnchors(lines){const anchors=[];const head=/^(?:Account\s*Name|Creditor\s*Name|Company\s*Name|Collection\s*Agency|Collection\s*Company|Reported\s*By)\s*(?::|\s{2,}|\s*-\s*)(.+)?$/i;const accountNameOnly=/^(?:Account\s*Name|Creditor\s*Name|Company\s*Name|Collection\s*Agency|Collection\s*Company|Reported\s*By)$/i;for(let i=0;i<lines.length;i++){let name='';const m=lines[i].match(head);if(m)name=m[1]?.trim()||'';else if(accountNameOnly.test(lines[i])&&i+1<lines.length)name=lines[i+1];if(name&&!/^(?:Account|Balance|Payment|Date|Credit|Report|Status|Not available|None|N\/A)$/i.test(name)&&name.length>2&&name.length<90)anchors.push({index:i,name:rrCompany(name)});}if(!anchors.length){for(let i=0;i<lines.length;i++){const hasAccount=/^Account\s*(?:Number|#|No\.|ID)\s*[:#]/i.test(lines[i]);if(!hasAccount)continue;const before=lines.slice(Math.max(0,i-5),i).reverse().find(s=>/^[A-Za-z][A-Za-z0-9 .,&'/-]{3,70}$/.test(s)&&!/^(?:Account|Balance|Credit|Report|Payment|Date|Status|Original|Address|Consumer)/i.test(s));if(before)anchors.push({index:Math.max(0,i-3),name:rrCompany(before)})}}return anchors.filter((x,i)=>i===0||x.index!==anchors[i-1].index)}
function rrParseAccounts(text,sourceName,forcedBureau){const lines=rrLines(text);const bureau=rrBureau(text,sourceName,forcedBureau);const anchors=rrAccountAnchors(lines);const reportDate=rrDate(rrField(lines.slice(0,110),['Report\\s*Date','Date\\s*of\\s*Report','Report\\s*Generated','Generated\\s*On','Prepared\\s*On']));const entries=[];for(let n=0;n<anchors.length;n++){const a=anchors[n],end=anchors[n+1]?.index??lines.length;const seg=lines.slice(a.index,Math.min(end,a.index+70));const account=rrLast4(rrField(seg,['Account\\s*(?:Number|No\\.?|#|ID|Reference)','Acct\\s*(?:No\\.?|Number|#)']));const balance=rrNum(rrField(seg,['(?:Current\\s*)?Balance','Amount\\s*Owed','Total\\s*Balance','Outstanding\\s*Balance']));const limit=rrNum(rrField(seg,['Credit\\s*Limit','Credit\\s*Line','Limit']));const originalCreditor=rrField(seg,['Original\\s*Creditor','Original\\s*Lender']);const status=rrField(seg,['Account\\s*Status','Payment\\s*Status','Status','Current\\s*Status']);const accountType=rrField(seg,['Account\\s*Type','Type\\s*of\\s*Account','Industry\\s*Type']);const pastDue=rrNum(rrField(seg,['Past\\s*Due(?:\\s*Amount)?','Amount\\s*Past\\s*Due']));const opened=rrDate(rrField(seg,['Date\\s*Opened','Opened','Date\\s*Account\\s*Opened']));const firstMissed=rrDate(rrField(seg,['Date\\s*of\\s*First\\s*Delinquency','First\\s*Delinquency','Date\\s*of\\s*First\\s*Default','First\\s*Missed\\s*Payment']));const lastReported=rrDate(rrField(seg,['Date\\s*(?:Last\\s*)?Reported','Last\\s*Reported','Reported\\s*On','Date\\s*Updated','Last\\s*Updated']));const paymentHistory=rrField(seg,['Payment\\s*History','Payment\\s*Rating']);const complete=[a.name,status,accountType,paymentHistory,seg.slice(0,16).join(' ')].join(' ').toLowerCase();let type='Other';if(/collection|debt buyer|recovery/.test(complete))type='Collection';else if(/charge.?off|charged.?off/.test(complete))type='Charge-off';else if(/repossess/.test(complete))type='Repossession';else if(/late|delinquen|30 days|60 days|90 days/.test(complete))type='Late payments';const score=[!!a.name,!!account,!!status,!!balance,!!limit].filter(Boolean).length;const id='r'+entries.length+'-'+Math.random().toString(36).slice(2,7);entries.push({id,company:a.name,originalCreditor,account,balance,limit,status,accountType,pastDue,opened,firstMissed,lastReported,reportDate,paymentHistory,type,bureau,source:sourceName,confidence:score>=4?'Good':score>=2?'Partial':'Low',raw:seg.slice(0,32).join('\n')});}return{bureau,reportDate,profile:rrProfile(lines.slice(0,140)),entries,lines:lines.length,hasText:text.trim().length>0};}
function rrHeuristic(a,all){const hints=[];const st=(a.status+' '+a.accountType+' '+a.paymentHistory).toLowerCase();if(a.type==='Collection'){hints.push({kind:'Review',title:'Check the collection details',body:'Compare the amount, creditor name, ownership and first-delinquency date with your records. A collection entry is not automatically an error.',issue:'balance'});hints.push({kind:'Option',title:'Debt validation request',body:'If you received a collector’s validation notice, review its dispute-by date. A validation request and a credit-bureau dispute are different processes.',issue:''})}else if(a.type==='Charge-off')hints.push({kind:'Review',title:'Check the charge-off reporting',body:'A charge-off means the lender wrote the debt off in its accounting. It does not by itself prove the balance is wrong or the debt is canceled.',issue:'balance'});if(/late|delinquen|30|60|90|120|past due/.test(st)||Number(a.pastDue)>0)hints.push({kind:'Review',title:'Verify payment history',body:'Check every late month against payment receipts and statements. A late mark should only be disputed if a specific date or status is inaccurate.',issue:'late'});if(/paid|settled|closed/.test(st)&&Number(a.balance)>0)hints.push({kind:'Check',title:'Balance and status need a closer look',body:'The status mentions paid, settled or closed but a balance is shown. Some closed accounts legitimately retain a balance. Verify the exact status and amount.',issue:'paid'});const balance=Number(a.balance),limit=Number(a.limit);if(a.limit&&limit>0&&a.balance&&balance>=0)hints.push({kind:'Education',title:'Credit utilization: '+Math.round(balance/limit*100)+'%',body:'This is the balance divided by the limit. High utilization can affect scoring but is not itself a reporting error or grounds for deletion.',issue:''});if(a.firstMissed)hints.push({kind:'Check',title:'First delinquency date',body:'Check the first missed-payment date against original statements. A sale to a collector does not create a new first delinquency date.',issue:'date'});const matches=all.filter(x=>x.id!==a.id&&x.company.toLowerCase().replace(/[^a-z0-9]/g,'')===a.company.toLowerCase().replace(/[^a-z0-9]/g,'')&&(!a.account||!x.account||a.account===x.account));if(matches.some(x=>x.bureau!==a.bureau&&x.balance!==a.balance&&x.balance!==''&&a.balance!==''))hints.push({kind:'Compare',title:'Balances differ across reports',body:'A matching creditor has a different balance on another bureau’s report. Reporting dates can differ. Compare the dates and your records before identifying an error.',issue:'balance'});if(matches.some(x=>x.bureau===a.bureau))hints.push({kind:'Compare',title:'Two similar entries appear',body:'Check whether these are separate legal accounts, or an original creditor and collector reporting the same debt. Similar entries do not automatically mean unlawful duplicates.',issue:'duplicate'});if(!hints.length)hints.push({kind:'Check',title:'Compare the report to your records',body:'Verify the owner, account reference, balance, status and dates. If all are accurate, there may be nothing to dispute.',issue:''});return hints;}
function rrExplain(a){let intro=`${a.company} is listed on ${a.bureau==='Not identified'?'an unidentified bureau report':a.bureau}. `;intro+=a.account?`The visible account reference ends in ${a.account}. `:'The account reference was not reliably extracted. ';if(a.balance!=='')intro+=`The reported balance is ${rrMoney(a.balance)}. `;if(a.status)intro+=`Its reported status is “${a.status}”. `;if(a.type==='Collection')intro+='A collection generally means a collector or debt buyer reports a debt. That is not proof the debt is valid or invalid. ';else if(a.type==='Charge-off')intro+='A charge-off is an accounting classification, not automatic debt forgiveness. ';else if(a.type==='Late payments')intro+='Late marks describe past payment timing, and must be compared with your actual payment records. ';if(a.limit)intro+=`The reported credit limit is ${rrMoney(a.limit)}. `;intro+='These are details extracted from the document, not verified findings. Check against the original report and supporting records.';return intro;}
function rrSummary(){const as=reportReader.accounts,collections=as.filter(a=>a.type==='Collection').length,charged=as.filter(a=>a.type==='Charge-off').length,late=as.filter(a=>a.type==='Late payments').length;const bs=[...new Set(as.map(a=>a.bureau))].filter(Boolean).join(', ')||'unknown bureau';if(!as.length)return 'I did not identify a clear account entry. Try pasting the text around one account or upload a clearer page. Nothing has been imported.';return `I found ${as.length} possible account ${as.length===1?'entry':'entries'} from ${bs}. ${collections} appear to be collections, ${charged} charge-offs and ${late} labeled with late-payment information. This is a preliminary extraction, not a determination that anything is inaccurate. For each item, I will explain the balance, status and dates, and what documents to compare before deciding whether a dispute is appropriate.`}
function rrInfoHTML(){return `<div class="callout mint"><strong>On-device report reading.</strong> Credit-report text stays in this browser session. The report is not sent to ChatGPT or a credit bureau. PDF/OCR libraries are downloaded from third-party CDNs only when needed; they process the document in your browser. No AI server analyzes this report. Automatic suggestions are rule-based and can be wrong.</div>`}
function readerPage(){const s=reportReader,client=activeClient();const selected=s.accounts.filter(a=>s.selected.has(a.id)).length;return `<section class="page-head"><div><div class="eyebrow">NEW · REPORT READER</div><h1>Read & analyze your report</h1><p>Upload once. Understand each account. Review potential dispute options. Fill the case after checking.</p></div></section>
<div class="card reader-intro"><div class="row-between"><div><div class="eyebrow">REPORT ASSISTANT</div><h3>Know what you're looking at</h3><p class="small soft">Reads text-based PDFs, scans screenshots using OCR, then explains entries in normal language.</p></div><div class="reader-icon" aria-hidden="true">▤</div></div><div class="row-wrap"><button class="btn mint" data-action="reader-pick">＋ Upload credit report</button><button class="btn secondary" data-action="reader-demo">Try a sample</button></div><input type="file" id="reportUpload" hidden multiple accept=".pdf,application/pdf,image/*,.txt,text/plain"/><div class="small-print" style="margin-top:13px">Supports PDF, JPG, PNG, screenshots, and TXT. Multiple files allowed. Scanned pages can take longer on iPhone. Internet is required the first time PDF/OCR tools load.</div></div>
<div class="card flat" style="margin-top:14px"><div class="row-between" style="margin-bottom:10px"><strong>Or paste text from a report</strong><span class="pill">Private session</span></div><textarea class="reader-paste" id="reportPaste" placeholder="Example: Account Name: ABC Bank&#10;Account Number: ****1234&#10;Balance: $850&#10;Account Status: Collection" rows="5">${rrEsc(s.paste)}</textarea><div class="row-wrap" style="margin-top:9px"><div class="field" style="flex:1;min-width:140px"><label for="readerBureau">Bureau shown</label><select id="readerBureau" data-reader-bureau="1"><option value="auto">Detect automatically</option>${BUREAUS.map(b=>`<option value="${b}" ${s.forcedBureau===b?'selected':''}>${b}</option>`).join('')}</select></div><button class="btn primary" data-action="reader-paste-run" style="align-self:end">Analyze pasted text</button></div></div>
${rrInfoHTML()}<div class="reader-progress ${s.busy?'reader-progress-busy':''}" id="readerProgress" aria-live="polite">${s.busy?'<span class="reader-spinner">◌</span> ':''}${rrEsc(s.status||'Ready for report files.')}${s.busy?'<button class="btn sm secondary" data-action="reader-cancel">Stop</button>':''}</div>
${s.extracted.length?`<div class="section-title"><h3>Files processed</h3><button class="btn ghost sm" data-action="reader-clear">Clear session</button></div><div class="stack">${s.extracted.map(x=>`<div class="reader-source"><span>▤</span><div><strong>${rrEsc(x.name)}</strong><div class="small muted">${rrEsc(x.bureau)} • ${x.entries.length} possible items • ${rrEsc(x.method)}${x.warning?' • '+rrEsc(x.warning):''}</div></div></div>`).join('')}</div>`:''}
${s.extracted.length?`<div class="reader-overview card"><span class="eyebrow">PLAIN-ENGLISH SUMMARY</span><h2>Here's what I found</h2><p>${rrEsc(rrSummary())}</p><div class="row-wrap"><button class="btn primary" data-action="reader-speak-summary">▶ Read it to me</button><button class="btn secondary" data-action="reader-speak-all">▶ Explain all items</button><button class="btn ghost" data-action="reader-stop-speech">■ Stop voice</button></div></div>`:''}

ImportConfirm"/><span>I compared selected details with the original report and understand this is a draft for review</span></label><div class="row-wrap"><button class="btn mint" data-action="reader-import">Import ${selected} ${selected===1?'entry':'entries'} into case →</button><button class="btn secondary" data-action="reader-speak-raw">▶ Read extracted report text</button></div>${s.importResult?`<div class="callout mint" style="margin-top:12px">${rrEsc(s.importResult)} <button class="btn sm secondary" data-action="nav" data-value="cases">Open cases</button></div>`:''}<details style="margin-top:15px"><summary class="small soft">Show extracted text (review against original)</summary><p class="small-print">Sensitive numbers are masked in this preview. The original document remains on your device.</p><pre class="reader-text-preview">${rrEsc(rrSanitize(s.reportText).slice(0,40000))}</pre></details></div>`:''}`}
function readerAccountHTML(a,n){const s=reportReader,review=s.review[a.id]||{},hints=rrHeuristic(a,s.accounts),chosen=!!s.selected.has(a.id);return `<section class="card reader-account" id="reader-account-${a.id}"><div class="row-between reader-account-head"><label class="reader-select"><input type="checkbox" data-reader-select="${a.id}" ${chosen?'checked':''}/><span class="reader-index">${n+1}</span><span class="reader-account-name">${rrEsc(a.company)}</span></label><span class="pill ${a.confidence==='Low'?'warn':''}">${rrEsc(a.confidence)} extraction</span></div><div class="reader-chips"><span>${rrEsc(a.bureau)}</span><span>${rrEsc(a.type)}</span>${a.account?`<span>•••• ${rrEsc(a.account)}</span>`:''}</div><div class="reader-grid"><div><small>Reported balance</small><strong>${rrEsc(rrMoney(a.balance))}</strong></div><div><small>Status</small><strong>${rrEsc(a.status||'Not shown')}</strong></div>${a.limit?`<div><small>Credit limit</small><strong>${rrEsc(rrMoney(a.limit))}</strong></div>`:''}${a.lastReported?`<div><small>Last reported</small><strong>${rrEsc(a.lastReported)}</strong></div>`:''}${a.firstMissed?`<div><small>First missed payment</small><strong>${rrEsc(a.firstMissed)}</strong></div>`:''}</div><div class="reader-explanation"><div class="row-between"><strong>What this means</strong><button class="btn secondary sm" data-action="reader-speak-item" data-value="${a.id}">▶ Listen</button></div><p>${rrEsc(rrExplain(a))}</p></div><div class="reader-suggestions"><strong>Things to examine — not proven errors</strong>${hints.map(h=>`<div class="reader-suggestion"><span class="reader-dot"></span><div><b>${rrEsc(h.title)}</b><p>${rrEsc(h.body)}</p></div></div>`).join('')}</div><div class="field" style="margin-top:16px"><label for="reader-note-${a.id}">Your insight / what your records show</label><textarea id="reader-note-${a.id}" data-reader-note="${a.id}" rows="3" placeholder="Example: My bank statement dated March 4 shows a $200 payment, but this report doesn't include it.">${rrEsc(review.note||'')}</textarea><div class="hint">Your observation is kept in this session until imported. Enter only truthful facts, not passwords or full account numbers.</div></div><div class="field" style="margin-top:12px"><label>Potential dispute category (optional)</label><select data-reader-issue="${a.id}"><option value="">No dispute selected — explanation only</option>${ISSUE_OPTS.map(opt=>`<option value="${opt[0]}" ${review.issue===opt[0]?'selected':''}>${rrEsc(opt[1])}</option>`).join('')}</select></div><label class="toggle-line" style="margin-top:10px"><input type="checkbox" data-reader-verified="${a.id}" ${review.verified?'checked':''}/><span><strong>I verified this specific issue using records</strong><span class="muted small">Only checked, documented issues can go into dispute letters.</span></span></label></section>`}
function rrSetStatus(message){reportReader.status=message;const el=document.getElementById('readerProgress');if(el)el.innerHTML=rrEsc(message)+(reportReader.busy?' <button class="btn sm secondary" data-action="reader-cancel">Stop</button>':'')}
async function rrLoadScript(url,globalName){if(window[globalName])return;await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=url;script.crossOrigin='anonymous';script.onload=resolve;script.onerror=()=>reject(new Error('Unable to load the '+globalName+' reader library. Check your internet connection.'));document.head.appendChild(script)});if(!window[globalName])throw Error('Reader library failed to initialize')}
async function rrPDFText(file){await rrLoadScript(REPORT_PDF_URL,'pdfjsLib');pdfjsLib.GlobalWorkerOptions.workerSrc=REPORT_PDF_WORKER;const doc=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer()),useSystemFonts:true}).promise;let text='',ocrCount=0;try{for(let p=1;p<=doc.numPages;p++){if(reportReader.cancel)break;rrSetStatus(`Reading ${file.name}: PDF page ${p} of ${doc.numPages}`);const page=await doc.getPage(p);const content=await page.getTextContent();const lines=new Map();for(const item of content.items||[]){if(!item.str?.trim())continue;const y=Math.round((item.transform?.[5]||0)*2)/2, x=item.transform?.[4]||0;if(!lines.has(y))lines.set(y,[]);lines.get(y).push({x,t:item.str})}let pageText=[...lines.entries()].sort((a,b)=>b[0]-a[0]).map(([,parts])=>parts.sort((a,b)=>a.x-b.x).map(v=>v.t).join(' ')).join('\n');if(pageText.trim().length<60){rrSetStatus(`Scanning page ${p} of ${doc.numPages} with on-device OCR…`);try{const vp=page.getViewport({scale:1.5}),canvas=document.createElement('canvas');canvas.width=Math.round(vp.width);canvas.height=Math.round(vp.height);await page.render({canvasContext:canvas.getContext('2d',{alpha:false}),viewport:vp}).promise;pageText=await rrOCR(canvas);canvas.width=0;canvas.height=0;ocrCount++}catch(err){pageText='';reportReader.error='Some scanned PDF pages could not be read: '+err.message}}text+=`\n[Page ${p}]\n${pageText}\n`;page.cleanup?.()}}finally{await doc.destroy()}return{text,method:ocrCount?`PDF text + OCR (${ocrCount} scanned pages)`:'PDF text extraction'}}
async function rrOCR(blobOrCanvas){await rrLoadScript(REPORT_OCR_URL,'Tesseract');if(!reportReader.ocrWorker)reportReader.ocrWorker=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status==='recognizing text'&&m.progress!=null)rrSetStatus('Recognizing letters on-device… '+Math.round(m.progress*100)+'%')}});const r=await reportReader.ocrWorker.recognize(blobOrCanvas);return r.data?.text||''}
async function rrProcess(files){if(reportReader.busy)return;const list=[...files];if(!list.length)return;reportReader.busy=true;reportReader.cancel=false;reportReader.error='';reportReader.importResult='';reportReader.status='Starting document reading…';render();let completed=0;try{for(const file of list){if(reportReader.cancel)break;const name=String(file.name||`Report ${reportReader.extracted.length+1}`);if(file.size>40*1024*1024){rrSetStatus(`${name}: over 40 MB; skipped for iPhone stability. Split the PDF into smaller parts.`);continue}let out={text:'',method:''};try{const type=file.type||'',ext=name.split('.').pop().toLowerCase();if(type==='application/pdf'||ext==='pdf')out=await rrPDFText(file);else if(type.startsWith('image/')||['jpg','jpeg','png','webp','heic'].includes(ext)){rrSetStatus(`Reading ${name} with on-device OCR…`);out={text:await rrOCR(file),method:'Image OCR'}}else if(type.startsWith('text/')||ext==='txt'){out={text:await file.text(),method:'Text file'}}else throw Error('Use PDF, JPG, PNG or TXT');const p=rrParseAccounts(out.text,name,reportReader.forcedBureau);if(p.profile.name&&reportReader.profile.name&&p.profile.name.toLowerCase().replace(/\s+/g,' ')!==reportReader.profile.name.toLowerCase().replace(/\s+/g,' '))throw Error('Different report holder detected. Clear the Reader session before opening another person’s report.');const entries=p.entries;reportReader.extracted.push({name,bureau:p.bureau,entries,method:out.method,warning:!entries.length?'no clear account entries':''});reportReader.accounts.push(...entries);reportReader.profile={...p.profile,...reportReader.profile};reportReader.reportText+=`\n===== ${name} =====\n${out.text}\n`;for(const a of entries){reportReader.selected.add(a.id);reportReader.review[a.id]={issue:'',note:'',verified:false}}completed++;rrSetStatus(`Analyzed ${completed} of ${list.length} files`)}catch(err){reportReader.extracted.push({name,bureau:'Unknown',entries:[],method:'Not read',warning:err.message});rrSetStatus(`${name}: ${err.message}`)}}reportReader.status=`Processed ${completed} ${completed===1?'file':'files'}. Review extracted fields against the originals.`;}finally{reportReader.busy=false;if(reportReader.ocrWorker){try{await reportReader.ocrWorker.terminate()}catch(_){ }reportReader.ocrWorker=null}render()}}
function rrProcessPaste(){const input=document.getElementById('reportPaste')?.value||reportReader.paste;reportReader.paste=input;if(!input.trim()){toast('Paste account text first');return}if(input.trim().length<35){toast('Paste a longer section that includes account details');return}const name='Pasted report '+(reportReader.extracted.length+1);const p=rrParseAccounts(input,name,reportReader.forcedBureau);if(p.profile.name&&reportReader.profile.name&&p.profile.name.toLowerCase().replace(/\s+/g,' ')!==reportReader.profile.name.toLowerCase().replace(/\s+/g,' ')){toast('Different person detected — Clear session before analyzing their report.');return}reportReader.extracted.push({name,bureau:p.bureau,entries:p.entries,method:'Pasted text'});reportReader.accounts.push(...p.entries);reportReader.profile={...p.profile,...reportReader.profile};reportReader.reportText+=`\n===== ${name} =====\n${input}\n`;for(const a of p.entries){reportReader.selected.add(a.id);reportReader.review[a.id]={issue:'',note:'',verified:false}}reportReader.status=`Analyzed pasted report; ${p.entries.length} possible accounts identified. Check original values before importing.`;reportReader.paste='';render()}
function rrDemo(){const sample=`Consumer Name: Alex Morgan\nCurrent Address: 123 Example Street Brooklyn NY 11201\nReport Date: 11/23/2026\nAccount Name: First Lakeshore Card\nAccount Number: XXXX4471\nAccount Status: Current\nBalance: $615.00\nCredit Limit: $2500\nDate Opened: 05/12/2020\nDate Last Reported: 11/10/2026\nAccount Name: Harlow Recovery Services\nAccount Number: XXXX9931\nAccount Status: Collection\nBalance: $842.00\nDate of First Delinquency: 06/03/2023\nDate Last Reported: 11/05/2026`;const p=rrParseAccounts(sample,'Fictional example — Experian','Experian');reportReader.extracted.push({name:'FICTIONAL example (not your data)',bureau:'Experian',entries:p.entries,method:'Demo data'});reportReader.accounts.push(...p.entries);reportReader.reportText+=sample;reportReader.profile=p.profile;for(const a of p.entries){reportReader.selected.add(a.id);reportReader.review[a.id]={issue:'',note:'',verified:false}}reportReader.status='Demo loaded. No real case data has been changed.';render()}
function rrStopSpeech(){if('speechSynthesis' in window)window.speechSynthesis.cancel();reportReader.speaking=false;reportReader.speechQueue=[]}
function rrSpeak(text){if(!('speechSynthesis' in window)){toast('Speech is unavailable on this device');return}rrStopSpeech();const clean=rrSanitize(text).replace(/\s+/g,' ').slice(0,30000);if(!clean.trim()){toast('No text to read');return}const chunks=clean.match(/.{1,180}(?:\s|$)/g)||[clean];reportReader.speechQueue=chunks;reportReader.speaking=true;function next(){if(!reportReader.speaking||!reportReader.speechQueue.length){reportReader.speaking=false;return}const u=new SpeechSynthesisUtterance(reportReader.speechQueue.shift());u.rate=reportReader.voiceRate;u.lang='en-US';u.onend=next;u.onerror=()=>{reportReader.speaking=false;toast('Speech ended; tap Listen to retry')};window.speechSynthesis.speak(u)}next();toast('Reading aloud · use Stop voice to finish')}
function rrImport(){const s=reportReader;const chosen=s.accounts.filter(a=>s.selected.has(a.id));if(!chosen.length){toast('Select at least one entry to import');return}if(!document.getElementById('readerImportConfirm')?.checked){toast('Check the report review confirmation first');return}const target=document.getElementById('readerTarget')?.value||'new';let c=target==='current'?activeClient():null;if(c&&s.profile.name&&c.name&&s.profile.name.toLowerCase().replace(/\s+/g,' ')!==c.name.toLowerCase().replace(/\s+/g,' ')&&!document.getElementById('readerOtherNameConfirm')?.checked){toast('This report names another person. Confirm the account holder or create a new case.');return}if(!c){c=newClient('');state.clients.push(c);state.activeId=c.id;}if(document.getElementById('readerProfileConfirm')?.checked){for(const k of ['name','address','city','state','zip']){if(!c[k]&&s.profile[k])c[k]=s.profile[k]}}let count=0,issueCount=0;for(const a of chosen){const newish=c.items.length===1&&!c.items[0].collector&&!c.items[0].originalCreditor&&!c.items[0].account&&!c.items[0].balance;const item=newish?c.items[0]:newItem();const t=item;if(!newish)c.items.push(t);t.type=a.type;t.collector=a.company;t.originalCreditor=a.originalCreditor||t.originalCreditor||'';t.account=a.account;t.balance=a.balance;t.status=a.status||a.accountType;t.reportDate=a.reportDate||t.reportDate;t.firstMissed=a.firstMissed||t.firstMissed;t.statusDate=a.lastReported||t.statusDate;t.bureaus=a.bureau==='Not identified'?[]:[a.bureau];const note=s.review[a.id]?.note?.trim()||'';const digest=`Imported from ${a.source} (${a.bureau}). Extracted: ${a.company}; account ending ${a.account||'not shown'}; balance ${rrMoney(a.balance)}; status ${a.status||'not shown'}; limit ${rrMoney(a.limit)}; opened ${a.opened||'not shown'}; original creditor ${a.originalCreditor||'not shown'}.${note?' My observation: '+rrSanitize(note):''}`;t.notes=(t.notes?t.notes+'\n':'')+digest;const rev=s.review[a.id]||{};if(rev.issue&&rev.verified&&note.trim().length>=12){t.issues=[...new Set([...t.issues,rev.issue])];if(rev.issue==='date'||rev.issue==='late'||rev.issue==='duplicate'||rev.issue==='personal'||rev.issue==='inquiry')t.dateExplanation=rrSanitize(note);else t.why=rrSanitize(note);issueCount++}t.reviewed={};c.activeItemId=t.id;count++;}signature=null;persist();s.importResult=`Imported ${count} item(s) into ${clientLabel(c)}. ${issueCount} independently verified issue(s) were added; review every field in Cases and verify each letter before signing.`;render();toast('Imported fields — review before generating letters')}
async function readerClick(action,val,el){const r=reportReader;switch(action){case 'reader-pick':document.getElementById('reportUpload')?.click();break;case 'reader-demo':rrDemo();break;case 'reader-paste-run':rrProcessPaste();break;case 'reader-clear':if(!confirm('Clear extracted report text and review notes from this session? Existing saved cases will remain unchanged.'))return;rrStopSpeech();r.files=[];r.extracted=[];r.accounts=[];r.reportText='';r.paste='';r.profile={};r.selected=new Set();r.review={};r.status='Session cleared.';r.importResult='';render();break;case 'reader-cancel':r.cancel=true;rrSetStatus('Stopping after the current page or image…');break;case 'reader-speak-summary':rrSpeak(rrSummary());break;case 'reader-speak-all':rrSpeak(rrSummary()+' '+r.accounts.map(a=>rrExplain(a)+' '+rrHeuristic(a,r.accounts).map(x=>x.title+': '+x.body).join('. ')).join(' '));break;case 'reader-speak-item':{const a=r.accounts.find(x=>x.id===val);if(a)rrSpeak(rrExplain(a)+' '+rrHeuristic(a,r.accounts).map(x=>x.title+': '+x.body).join('. '));break}case 'reader-speak-raw':rrSpeak(r.reportText);break;case 'reader-stop-speech':rrStopSpeech();toast('Voice stopped');break;case 'reader-import':rrImport();break;}}
function readerInput(el){if(el.id==='reportPaste'){reportReader.paste=el.value;return true}if(el.dataset.readerNote){reportReader.review[el.dataset.readerNote]??={};reportReader.review[el.dataset.readerNote].note=el.value;return true}return false}
function readerChange(el){if(el.id==='reportUpload'){const fs=[...el.files||[]];el.value='';void rrProcess(fs);return true}if(el.dataset.readerSelect){if(el.checked)reportReader.selected.add(el.dataset.readerSelect);else reportReader.selected.delete(el.dataset.readerSelect);const indicator=document.querySelector('.reader-review .btn.mint');if(indicator)indicator.textContent=`Import ${reportReader.selected.size} ${reportReader.selected.size===1?'entry':'entries'} into case →`;return true}if(el.dataset.readerIssue){reportReader.review[el.dataset.readerIssue]??={};reportReader.review[el.dataset.readerIssue].issue=el.value;return true}if(el.dataset.readerVerified){reportReader.review[el.dataset.readerVerified]??={};reportReader.review[el.dataset.readerVerified].verified=el.checked;return true}if(el.dataset.readerBureau){reportReader.forcedBureau=el.value;return true}return false}

 ['balance','Balance is incorrect','Payments, fees, settlement or other amount differs from records'],

function newItem(){return {id:ID(),type:'Collection',collector:'',originalCreditor:'',account:'',balance:'',correctBalance:'',status:'',why:'',otherDetails:'',dateExplanation:'',firstMissed:'',firstLate:'',lastPayment:'',statusDate:'',reportDate:'',firstReported:'',validationNotice:'',validationEnd:'',ownership:'unsure',priorDispute:'none',courtPapers:false,identityConfirmed:false,issues:[],questions:[],records:[],bureaus:[...BUREAUS],letterAddresses:{},recipientName:'',notes:'',sentDates:{},reviewed:{},delivery:'online',files:[],createdAt:new Date().toISOString()};}
function newClient(name=''){const item=newItem();return{id:ID(),name,address:'',city:'',state:'',zip:'',email:'',phone:'',isClient:false,authorization:false,items:[item],activeItemId:item.id,createdAt:new Date().toISOString()};}
function initialState(){const empty={tab:'home',step:'profile',letter:'bureau',bureau:'Experian',saving:false,clients:[],activeId:null};try{const saved=JSON.parse(localStorage.getItem(STORE));if(saved&&saved.saving&&Array.isArray(saved.clients))return{...empty,...saved,tab:'home',step:'profile',letter:'bureau',bureau:'Experian',saving:true};}catch(_e){}return empty;}

function activeClient(){return state.clients.find(c=>c.id===state.activeId)||null}

><div style="width:${percent}%;height:100%;background:linear-gradient(90deg,#8a98fc,#64e6c9);border-radius:10px"></div></div><div class="grid-2">${steps.map(x=>`<div class="inline-status ${x[1]?'done':''}"><span class="circle">${x[1]?'✓':'○'}</span><span>${x[0]}</span></div>`).join('')}</div><div class="spacer-8"></div><div class="row-wrap"><button class="btn primary" data-action="nav" data-value="letters">Open letter studio</button><button class="btn secondary" data-action="nav" data-value="reader">▤ Read credit report</button></div></div>`:empty('Your workspace is ready','Create a case or explore a prefilled example. No account or subscription required.','demo','Load example case','✦')}

if(state.step==='issues')return `<div class="card"><h3>Is this account yours?</h3><p class="muted small">Choose the truthful answer. A legitimate account can still contain an inaccurate field.</p><div class="choice-grid">${[['yes','Yes, it is mine','I know this account'],['unsure','Not sure yet','I need more information'],['no','No, not mine','I know it is not mine']].map(x=>`<button class="choice ${i.ownership===x[0]?'selected':''}" data-action="ownership" data-value="${x[0]}">${x[1]}<small>${x[2]}</small></button>`).join('')}</div><div class="line"></div><h3>What specifically needs correction?</h3><p class="muted small">Select only issues supported by the person's own records. Every selected error feeds the letter.</p><div class="checkboxes">${ISSUE_OPTS.map(x=>`<label class="toggle-line"><input type="checkbox" data-array="issues" data-value="${x[0]}" ${i.issues.includes(x[0])?'checked':''}/><span><strong>${x[1]}</strong><span class="muted small">${x[2]}</span></span></label>`).join('')}</div><div class="spacer-15"></div><div class="field-grid">${area('Explain what is inaccurate and why','item','why',i.why,'Example: My statement shows $615 after a $227 payment, but the report shows $842.','Give specific facts and document dates if available.')}${area('Correct date / duplicate entries / other details','item','dateExplanation',i.dateExplanation,'Specify the dates, names and records that support your dispute.')}</div><div class="line"></div><h3>Questions for a debt collector</h3><p class="muted small">A request to validate a debt is separate from an accuracy dispute with a bureau.</p><div class="checkboxes">${QUESTIONS.map(x=>`<label class="toggle-line"><input type="checkbox" data-array="questions" data-value="${x[0]}" ${i.questions.includes(x[0])?'checked':''}/><span>${x[1]}</span></label>`).join('')}</div><div class="line"></div><h3>Evidence you really have</h3><div class="checkboxes">${RECORDS.map(x=>`<label class="toggle-line"><input type="checkbox" data-array="records" data-value="${E(x)}" ${i.records.includes(x)?'checked':''}/><span>${E(x)}</span></label>`).join('')}</div><div class="line"></div><h3>Appears on which reports?</h3><div class="mini-flex">${BUREAUS.map(b=>`<button class="choice ${i.bureaus.includes(b)?'selected':''}" style="min-height:45px;flex:1;justify-content:center" data-action="bureau-toggle" data-value="${b}">${b}</button>`).join('')}</div>${i.ownership==='no'&&!i.issues.includes('notmine')?'<div class="callout top-banner">If you know an account is not yours, you may select “Account is not mine” as the inaccuracy.</div>':''}</div>`;
return `<div class="card"><h3>Timeline & delivery</h3><p class="muted small">Record what happened; due dates here are reminders, not authoritative court deadlines.</p><div class="field-grid">${field('Validation notice received','item','validationNotice',i.validationNotice,'','','date')}${field('Validation dispute-by date on notice','item','validationEnd',i.validationEnd,'','','date')}${selectField('Previous dispute?','item','priorDispute',i.priorDispute,[['none','No prior dispute'],['bureau','Yes, with a bureau'],['collector','Yes, with a collector'],['direct','Yes, with the creditor']])}</div><div class="spacer-15"></div>${toggle('Court papers were served','item','courtPapers',i.courtPapers,'Credit disputes do not pause lawsuits or court deadlines.')}${i.courtPapers?'<div class="callout warning top-banner"><strong>Urgent:</strong> Respond to the summons by the court’s deadline. A dispute letter does not replace a court response. Consult qualified local legal help.</div>':''}${i.validationEnd?`<div class="date-alert" style="margin-top:12px">Validation period date shown on your notice: <strong>${displayDate(i.validationEnd)}</strong> (${daysUntil(i.validationEnd)>=0?daysUntil(i.validationEnd)+' days remaining':'date has passed'}). This is the date entered by you, not a legal determination.</div>`:''}<div class="line"></div><h3>Track correspondence</h3><p class="muted small">Log the date the bureau received your dispute (not just when you mailed it).</p><div class="field-grid">${BUREAUS.map(b=>`<div class="field"><label>${b} — received date</label><input type="date" data-date-key="${b}" value="${E(i.sentDates?.[b]||'')}"/></div>`).join('')}${field('Collector received date','sent','Collector',i.sentDates?.Collector||'','','date')}</div>${BUREAUS.filter(b=>i.sentDates?.[b]).map(b=>`<div class="inline-status"><span class="circle">◷</span><span>${b}: estimated 30-day investigation mark <strong>${displayDate(addDays(i.sentDates[b],30))}</strong> (some cases may take longer)</span></div>`).join('')}</div>`;}
function describeIssues(i){const lines=[];const detail=i.why?.trim();const extra=i.dateExplanation?.trim();
if(i.issues.includes('balance'))lines.push(`The reported balance${i.balance?' of '+money(i.balance):''} appears inaccurate${i.correctBalance!==''?'; my records show '+money(i.correctBalance):''}.${detail?' '+detail:''}`);
if(i.issues.includes('date'))lines.push(`One or more reporting dates appear inaccurate.${extra?' According to my records, '+extra:''}`);
if(i.issues.includes('paid'))lines.push(`This account is reported as unpaid despite my records indicating a payment or settlement.${detail?' '+detail:''}`);
if(i.issues.includes('duplicate'))lines.push(`The same debt may be reported more than once. Please investigate whether each entry is accurate and identifies a separate reporting obligation.${extra?' Relevant details: '+extra:''}`);
if(i.issues.includes('late'))lines.push(`The reported late-payment history appears inaccurate.${extra?' According to my records, '+extra:''}`);
if(i.issues.includes('notmine'))lines.push(i.ownership==='no'?'This account is not mine. Please investigate whether it belongs to another consumer.':'I do not recognize this account and request investigation of its attribution to me.');
if(i.issues.includes('inquiry'))lines.push(`I dispute the accuracy of the inquiry entry and request an investigation into whether it is correctly attributed to me.${extra?' '+extra:''}`);
if(i.issues.includes('personal'))lines.push(`The personal information associated with this report is inaccurate.${extra?' Correct information: '+extra:''}`);
if(i.issues.includes('bankruptcy'))lines.push(`The balance or payment status associated with a bankruptcy discharge appears inaccurate.${extra?' My records show: '+extra:''}`);
if(i.issues.includes('other'))lines.push(`I dispute the following specific information: ${fmt(extra||detail,'[[describe the exact error]]')}.`);
return lines;}
function letterKey(){return state.letter+'|'+(state.letter==='bureau'?state.bureau:'general')}
function buildLetter(c,i,type=state.letter,bureau=state.bureau){const issues=describeIssues(i);const errors=[];const delivery=i.delivery||'online';const addresses=i.letterAddresses||{};const addrKey=type==='bureau'?'bureau-'+bureau:type;const addr=addresses[addrKey]||'';const recipient= type==='bureau'?bureau:type==='collector'?i.collector:type==='direct'||type==='goodwill'?i.originalCreditor||i.collector:type==='personal'?bureau:type==='inquiry'?bureau:bureau;
const label= type==='bureau'?'Credit report accuracy dispute':type==='collector'?'Debt dispute and verification request':type==='direct'?'Direct dispute of furnished credit information':type==='goodwill'?'Goodwill adjustment request':type==='identity'?'Identity theft report and request to block fraudulent information':type==='personal'?'Personal information correction': 'Disputed inquiry';
if(!c.name?.trim())errors.push('Full legal name');if(!c.address?.trim()||!c.city?.trim()||!c.state?.trim()||!c.zip?.trim())errors.push('Complete mailing address');if(!i.collector?.trim()&&!i.originalCreditor?.trim()&&type!=='personal')errors.push('Reporting company / creditor');if(type==='collector'&&!i.collector?.trim())errors.push('Collector name');if(delivery==='mail'&&!addr.trim())errors.push('Recipient mailing address');if(c.isClient&&!c.authorization)errors.push('Client authorization acknowledgment');
if(['bureau','direct','personal','inquiry'].includes(type)&&issues.length===0)errors.push('Select a specific error');if(type==='collector'&&i.ownership==='yes'&&!i.questions?.length&&!issues.length)errors.push('Describe why you request verification');if(type==='identity'&&!i.identityConfirmed)errors.push('Confirm identity theft claim is truthful');if(type==='identity'&&!i.records.includes('FTC identity theft report'))errors.push('FTC identity theft report (if requesting a block)');
if(type==='bureau'&&!i.bureaus.includes(bureau))errors.push(`${bureau} not selected in the case`);if(i.issues.includes('notmine')&&i.ownership==='yes'&&type!=='goodwill')errors.push('Account ownership conflicts with the not-mine issue');if(type==='identity'&&i.ownership==='yes')errors.push('Identity theft claim conflicts with confirmed ownership');
const clientName=fmt(c.name,'[[full legal name]]');const senderAddress=fmt(c.address,'[[street address]]');const location=[c.city,c.state].filter(Boolean).join(', ')+' '+(c.zip||'');const accountId=i.account?` ending ${i.account}`:'';const accountName=i.collector||i.originalCreditor||'the listed company';
const opener=`I am writing regarding ${accountName}${accountId} as shown on my consumer credit report${i.reportDate?' dated '+displayDate(i.reportDate):''}.`;
let body='';
if(type==='bureau')body=`I am disputing inaccurate or incomplete information in my credit file. ${opener}\n\nThe following specific information needs to be investigated:\n${issues.map((x,n)=>`${n+1}. ${x}`).join('\n')||'[[describe the specific inaccurate reporting]]'}\n\nPlease conduct a reasonable reinvestigation, review the supporting records I have provided, and correct or remove information that cannot be verified as accurate and complete. Please send the results and an updated copy of the relevant credit report when applicable.`;
if(type==='collector')body=`I am writing regarding your attempt to collect an alleged debt associated with ${accountName}${accountId}${i.balance?' in the amount of '+money(i.balance):''}. I dispute ${i.issues.includes('balance')?'the amount claimed':'this debt to the extent described below'} and request verification.\n\n${issues.length?issues.join('\n'):i.questions?.length?'I need additional information to understand the identity of the creditor, the basis for the balance, and the account to which it relates.':'I am requesting sufficient information to identify and verify the alleged obligation.'}\n\nPlease provide verification of the disputed debt and, if different from the current creditor, the name and address of the original creditor. Please explain the amount claimed, including payments, interest and fees as applicable.${i.validationEnd&&daysUntil(i.validationEnd)>=0?'\n\nTo the extent this written dispute is received within the validation period, please cease collection of the disputed amount until you provide the verification or a copy of a judgment required by 12 CFR § 1006.38(d)(2).':''}\n\nThis letter does not acknowledge liability or authorize a payment.`;
if(type==='direct')body=`I dispute the accuracy of information your organization furnished about ${accountName}${accountId}. ${opener}\n\nThe specific disputed information is:\n${issues.map((x,n)=>`${n+1}. ${x}`).join('\n')||'[[describe the specific inaccurate furnishing]]'}\n\nPlease investigate this direct dispute in accordance with applicable requirements, review the enclosed records, and correct any information that you determine is inaccurate or incomplete. Please send me the results in writing.`;
if(type==='goodwill')body=`I am writing to respectfully request a goodwill review of the reporting on ${accountName}${accountId}. I understand that accurate reporting is generally permitted and that you are not obligated to remove accurate history.\n\nI would appreciate consideration of a discretionary goodwill adjustment based on the circumstances below:\n\n${fmt(i.why,'[[Explain the circumstances truthfully, including what has changed and why you are asking]]')}\n\nI am not asking you to report anything false. Thank you for considering this request.`;
if(type==='identity')body=`I am reporting that the account or information associated with ${accountName}${accountId} resulted from identity theft and does not belong to me. I did not authorize the transactions or application associated with this item.\n\nI request that you block the identified identity-theft information from my consumer report as provided under applicable law, subject to the required documentation. I have included an identity theft report in the listed enclosures, and I can provide proof of identity through your official identity-verification process as required.\n\nPlease confirm the action taken and contact me in writing if additional documentation is needed. This report concerns only the specific item identified above.`;
if(type==='personal')body=`I am disputing inaccurate personal-identifying information in my credit file. The incorrect entry and correct information are:\n\n${fmt(i.dateExplanation||i.why,'[[Describe each incorrect name, address, phone or employer entry and the correct value]]')}\n\nPlease investigate the discrepancy and update or delete the inaccurate personal information as appropriate. I can provide supporting identity and address documentation through your official process.`;

opy-letter" ${ready?'':'disabled'}>Copy letter</button></div></div>${state.letter==='bureau'?`<div class="card flat"><div class="row-between"><div><strong>Official submission</strong><div class="muted small">Submit it yourself; this app never logs in or sends anything.</div></div><span class="pill">${state.bureau}</span></div><div class="spacer-8"></div><a class="open-link external" href="${LINKS[state.bureau]}" target="_blank" rel="noopener noreferrer">Open ${state.bureau} dispute center <span>↗</span></a></div>`:''}</div><div class="stack"><div class="card" style="padding:13px"><div class="row-between" style="padding:4px 4px 12px"><div><strong>Live document</strong><div class="muted small">Changes appear here after typing.</div></div><span class="pill ${ready?'success':'warn'}">${ready?'Ready':'Draft'}</span></div><div class="paper" id="letterPreview">${previewHtml(l)}</div></div><div class="row-wrap"><button class="btn primary" style="flex:1" data-action="pdf-letter" ${ready?'':'disabled'}>⬇ Save / Share PDF</button><button class="btn secondary" data-action="print-letter" ${ready?'':'disabled'}>Print</button></div><div class="small-print">PDFs include the signature drawn during this session. If you haven’t signed, leave a blank line and sign by hand. iPhone can share the PDF to Files, AirDrop or Mail.</div></div></div>

<div class="section-title"><h3>One-tap official portals</h3></div><div class="stack">${[['Free credit reports',LINKS.reports,'AnnualCreditReport.com'],...BUREAUS.map(b=>[b,LINKS[b],b+' online dispute center']),['Report identity theft',LINKS.ftc,'FTC IdentityTheft.gov']].map(x=>`<a class="open-link external" href="${x[1]}" rel="noopener noreferrer" target="_blank"><span><strong>${x[0]}</strong><br><small class="muted">${x[2]}</small></span><span>↗</span></a>`).join('')}</div>
<div class="section-title"><h3>Know your rights</h3></div><div class="course-grid"><div class="course-card"><details><summary>01 • What happens after a bureau dispute?</summary><p>Under the FCRA, a credit reporting agency generally has 30 days after receiving a dispute to investigate; certain situations allow up to 45 days. Keep the confirmation and actual receipt date. Review results and compare the updated information with your evidence.</p><a class="external small" href="${LINKS.fcra}" target="_blank" rel="noopener">Source: CFPB — investigation timelines</a></details></div><div class="course-card"><details><summary>02 • Collector debt validation</summary><p>If you dispute a debt in writing within the validation period, a covered debt collector generally must stop collection of the disputed portion until it provides verification or a copy of a judgment. A bureau dispute is a separate process. The exact rights depend on the collector and facts.</p><a class="external small" href="${LINKS.fdcp}" target="_blank" rel="noopener">Source: CFPB — debt validation</a></details></div><div class="course-card"><details><summary>03 • Exact errors beat blanket templates</summary><p>Name each inaccurate balance, date, status, late mark or identity detail. Attach supporting statements. An accurate negative record does not become removable just because a template demands it.</p><a class="external small" href="${LINKS.cfpb}" target="_blank" rel="noopener">Source: CFPB — disputes</a></details></div><div class="course-card"><details><summary>04 • Identity theft versus a data breach</summary><p>A company-wide breach does not by itself prove that a particular credit account was opened or used fraudulently. Verify the facts. If your identity was stolen, use the FTC recovery process and official bureau procedures; do not claim a false identity theft incident.</p><a class="external small" href="${LINKS.ftc}" target="_blank" rel="noopener">FTC recovery steps</a><div class="spacer-8"></div><a class="external small" href="${LINKS.breach}" target="_blank" rel="noopener">Optional breach exposure lookup</a></details></div><div class="course-card"><details><summary>05 • If a collector files a lawsuit</summary><p>A credit dispute letter does not stop a lawsuit or extend the response date on a summons. Preserve court documents, follow the actual court deadline and obtain qualified legal assistance where appropriate.</p></details></div><div class="course-card"><details><summary>07 • Put this app on your iPhone Home Screen</summary><p>Publish the included app files at an HTTPS website address using GitHub Pages or another static host. Open that website in Safari, tap the Share icon, choose Add to Home Screen, and enable Open as Web App if available. Download the ZIP and follow README.txt for step-by-step instructions.</p><p>Only the website code is public. Case data entered on the device is not published to the website; however, local device data and exported backups are not encrypted.</p></details></div><div class="course-card"><details><summary>06 • Goodwill requests and accurate records</summary><p>A goodwill letter asks for discretionary consideration, not a legal deletion. It should never assert that accurate information is fraudulent or inaccurate. Corrections are appropriate when specific reporting facts are wrong.</p></details></div></div>
<div class="section-title"><h3>Case tools</h3></div><div class="grid-2"><button class="case-item" data-action="settings"><div class="avatar">⇄</div><div class="grow"><strong>Case transfer</strong><small>Copy code and backups</small></div></button><button class="case-item" data-action="speak-help"><div class="avatar">◖</div><div class="grow"><strong>Read this aloud</strong><small>iPhone voice support</small></div></button></div><div class="callout warning top-banner"><strong>Professional-use note:</strong> A personal browser is not an encrypted client portal. If offering paid credit-repair services, use legally compliant agreements, authorization, privacy/security measures and applicable federal/state consumer protections. This app does not manage those requirements.</div>`;}

not be undone.</p><div class="row-wrap"><button class="btn danger sm" data-action="clear-all">Erase workspace</button>${c?'<button class="btn ghost sm" data-action="delete-client">Delete active client</button>':''}</div></div><p class="small-print" style="margin-top:14px">The app has no server, account login or cloud sync. Anyone with access to the unlocked browser or an exported backup could read the stored data. Do not enter SSNs, passwords, full account numbers or other highly sensitive data.</p>`;}
